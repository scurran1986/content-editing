<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VoiceCam POC</title>
<style>
  body{margin:0;background:#000;color:#fff;font:16px system-ui;display:flex;flex-direction:column;height:100dvh}
  video{flex:1;width:100%;object-fit:cover;background:#111}
  #bar{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button,select{font:inherit;padding:12px 16px;border:0;border-radius:8px;background:#333;color:#fff}
  button.on{background:#e33}
  #status{font-weight:700}
  #heard{color:#9f9;min-height:1.2em}
  #log{font:12px monospace;color:#aaa;max-height:12em;overflow:auto;padding:0 10px 10px;white-space:pre-line;user-select:text}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div id="bar">
  <select id="src"><option value="camera">Camera</option><option value="screen">Screen</option></select>
  <button id="mic">Start listening</button>
  <span id="status">idle</span>
  <span id="heard"></span>
  <a id="save" hidden><button>Save clip</button></a>
</div>
<div id="log">Say: record, pause, resume, stop, play, rewind, fast forward</div>
<script src="commands.js"></script>
<script>
const $ = id => document.getElementById(id);
const log = m => {
  $('log').textContent = m + '\n' + $('log').textContent;
  if (location.hostname === 'localhost') navigator.sendBeacon('/log', new Date().toISOString().slice(11, 19) + ' ' + m);
};
window.onerror = (m, s, l) => log('JS ERROR ' + m + ' @' + l);
window.onunhandledrejection = e => log('PROMISE ERROR ' + (e.reason?.message || e.reason));
let stream, rec, chunks = [], clip = null, state = 'idle';

function setState(s) { state = s; $('status').textContent = s; log('state: ' + s + (rec ? ' rec=' + rec.state : '')); }

async function camera() {
  if (stream) return stream;
  if ($('src').value === 'screen') {
    // ponytail: screen video + mic audio merged into one stream; system audio not captured.
    const disp = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream = new MediaStream([...disp.getVideoTracks(), ...mic.getAudioTracks()]);
    disp.getVideoTracks()[0].onended = () => actions.stop();   // user clicked "Stop sharing"
    log('got screen+mic');
  } else {
  const tries = [
    ['cam+mic', { video: { facingMode: 'user' }, audio: true }],
    ['cam+mic(any)', { video: true, audio: true }],
    ['cam only', { video: true }],
    ['mic only', { audio: true }],
  ];
  for (const [name, c] of tries) {
    try { stream = await navigator.mediaDevices.getUserMedia(c); log('got ' + name); break; }
    catch (e) { log(name + ': ' + e.name + ' ' + e.message); }
  }
  if (!stream) {
    const devs = await navigator.mediaDevices.enumerateDevices().catch(() => []);
    log('devices: ' + (devs.map(d => d.kind).join(',') || 'none') + ' — check Settings > Safari > Camera/Microphone = Ask/Allow');
    throw new Error('no media');
  }
  }
  $('v').srcObject = stream; $('v').muted = true;
  log('tracks: ' + stream.getTracks().map(t => t.kind + ':' + t.label + ':' + t.readyState).join(' | '));
  return stream;
}
$('v').onerror = () => log('video error: ' + ($('v').error?.message || $('v').error?.code));
$('v').onloadedmetadata = () => {
  if ($('v').srcObject) return;
  if ($('v').duration === Infinity) { $('v').currentTime = 1e9; $('v').ontimeupdate = () => { $('v').ontimeupdate = null; $('v').currentTime = 0; }; }  // webm from MediaRecorder lacks duration; force Chrome to compute it
  log('clip ' + $('v').videoWidth + 'x' + $('v').videoHeight + ' ' + $('v').duration + 's');
};

const actions = {
  async record() {
    if (rec && rec.state !== 'inactive') return;
    await camera();
    chunks = []; clip = null;
    rec = new MediaRecorder(stream);
    log('recorder: ' + rec.mimeType);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      log('chunks: ' + chunks.length + ' bytes: ' + chunks.reduce((n, c) => n + c.size, 0));
      clip = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType }));
      $('v').srcObject = null; $('v').src = clip; $('v').muted = false; $('v').controls = true;
      $('save').href = clip; $('save').download = 'voicecam-' + Date.now() + (rec.mimeType.includes('mp4') ? '.mp4' : '.webm'); $('save').hidden = false;
      setState('stopped');
    };
    rec.start(1000); setState('recording');
  },
  pause()  { if (rec?.state === 'recording') { rec.pause(); setState('paused'); }
             else if (clip) { $('v').pause(); setState('paused'); } },
  resume() { if (rec?.state === 'paused') { rec.resume(); setState('recording'); } else actions.play(); },
  stop()   { if (rec && rec.state !== 'inactive') rec.stop(); else if (clip) { $('v').pause(); $('v').currentTime = 0; setState('stopped'); } },
  play()   { if (clip) { $('v').play(); setState('playing'); } },
  rewind() { if (clip) $('v').currentTime = Math.max(0, $('v').currentTime - 5); },
  forward(){ if (clip) $('v').currentTime += 5; },
};

// ponytail: Web Speech API only. Safari sends audio to Apple; fine for a POC.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let sr, listening = false, srActive = false, lastCmd = 0;
function listen() {
  if (!SR) { log('No SpeechRecognition in this browser'); return; }
  sr = new SR(); sr.continuous = true; sr.interimResults = true; sr.lang = 'en-US';
  sr.onstart = () => { srActive = true; log('sr: started'); };
  sr.onaudiostart = () => log('sr: audio');
  sr.onspeechstart = () => log('sr: speech');
  sr.onresult = e => {
    const r = e.results[e.results.length - 1];
    const text = r[0].transcript;
    $('heard').textContent = text;
    log((r.isFinal ? 'heard: ' : 'interim: ') + text);
    const cmd = parseCommand(text);
    // ponytail: 1.5s debounce is the echo guard — playback saying "stop" re-triggers otherwise. Tune on device.
    if (cmd && Date.now() - lastCmd > 1500) { lastCmd = Date.now(); log('> ' + cmd); actions[cmd](); }
  };
  sr.onerror = e => { log('sr error: ' + e.error); if (['not-allowed', 'service-not-allowed', 'language-not-supported'].includes(e.error)) listening = false; };
  sr.onend = () => { srActive = false; log('sr: ended'); if (listening) setTimeout(() => { if (listening && !srActive) try { sr.start(); } catch (e) { log('sr restart: ' + e.message); } }, 250); };
  document.onvisibilitychange = () => { if (!document.hidden && listening && !srActive) try { sr.start(); } catch (e) {} };
  sr.start(); listening = true;
  $('mic').textContent = 'Listening'; $('mic').classList.add('on');
}
$('mic').onclick = async () => {
  if (listening) { listening = false; sr.stop(); $('mic').textContent = 'Start listening'; $('mic').classList.remove('on'); return; }
  try { listen(); await camera(); } catch (e) { log('camera: ' + e.message); }
};
</script>
</body>
</html>
